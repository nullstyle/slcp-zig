[tools]
just = "latest"
# Schema tools use the verified WASM archive in tools/capnp-toolchain.json.
wasmtime = "48.0.1"

# THE single Zig version specifier for this repo (capnp-zig's convention):
# build.zig.zon holds only a FLOOR (minimum_zig_version), never a second pin.
# If you manage Zig with zvm, its PATH entry wins over mise's shims — run
# `mise exec -- zig ...` to match CI, or drop zvm from PATH.
# Pin TAGGED releases: ziglang.org deletes dev builds within weeks, and the
# old dev.1786 pin is already gone, which turned every CI Zig install into
# a lottery. Bumping Zig is this one line (plus the floor when it moves).
zig = "0.17.0"
